<!doctype html><html lang="ca"><meta charset="utf-8"><style>
body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground)}#dipol canvas{display:block;width:100%;height:410px;touch-action:none;cursor:grab}#dipol .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}#dipol button{font:inherit;padding:8px 14px;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius)}#dipol .caption{color:var(--muted-foreground);margin:12px 0;font-size:14px}#dipol h3{font-size:18px;font-weight:500;margin:8px 0}#dipol .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}#dipol .sample{width:26px;height:3px;background:var(--chart-1);display:inline-block;vertical-align:middle;margin-right:6px}
</style><section id="dipol"><h3>Dipol de mitja ona · λ/2</h3><div class="caption">Potència normalitzada · escala radial lineal</div><canvas role="img" aria-label="Diagrama tridimensional de potència d’un dipol vertical: màxim al pla horitzontal i nuls a l’eix vertical. Arrossega per girar; també pots fer servir els botons de vista.">Diagrama de radiació 3D.</canvas><div class="controls"><button type="button" data-view="3d">Perspectiva</button><button type="button" data-view="front">Vista lateral</button><button type="button" data-view="top">Vista superior</button></div><div class="caption">Arrossega per girar el model.</div><div class="legend"><span><i class="sample"></i>Superfície: P/Pmàx</span><span>Barra central: dipol (esquemàtic)</span></div></section><script>
(()=>{const root=document.getElementById('dipol'),canvas=root.querySelector('canvas'),context=canvas.getContext('2d');let yaw=.6,tilt=.38,width=700,height=410,drag=null;const tau=Math.PI*2;const points=[],faces=[];function power(theta){return Math.abs(Math.sin(theta))<1e-8?0:(Math.cos(Math.PI/2*Math.cos(theta))/Math.sin(theta))**2}for(let row=0;row<=40;row++){const theta=row*Math.PI/40,radial=power(theta);for(let column=0;column<=64;column++){const phi=column*tau/64;points.push([radial*Math.sin(theta)*Math.cos(phi),radial*Math.sin(theta)*Math.sin(phi),radial*Math.cos(theta)])}}for(let row=0;row<40;row++)for(let column=0;column<64;column++){const index=row*65+column;faces.push([index,index+1,index+66,index+65])}function project(point){const horizontal=Math.cos(yaw)*point[0]-Math.sin(yaw)*point[1],depth=Math.sin(yaw)*point[0]+Math.cos(yaw)*point[1];const screenVertical=Math.cos(tilt)*point[2]-Math.sin(tilt)*depth;return[width/2+horizontal*Math.min(width*.35,150),height/2-screenVertical*Math.min(width*.35,150),Math.cos(tilt)*depth+Math.sin(tilt)*point[2]]}function draw(){const style=getComputedStyle(root),foreground=style.getPropertyValue('--foreground').trim()||'#d6d6d6',border=style.getPropertyValue('--border').trim()||'#777',series=style.getPropertyValue('--chart-1').trim()||'#4c9ced';context.clearRect(0,0,width,height);function line(start,end,color,lineWidth=1){const first=project(start),last=project(end);context.beginPath();context.moveTo(first[0],first[1]);context.lineTo(last[0],last[1]);context.strokeStyle=color;context.lineWidth=lineWidth;context.stroke()}function label(point,text,offset=8){const screen=project(point);context.fillStyle=foreground;context.font='13px system-ui';context.fillText(text,screen[0]+offset,screen[1]-7)}for(let axis=0;axis<2;axis++){const start=[0,0,0],end=[0,0,0];start[axis]=-1.12;end[axis]=1.12;line(start,end,border)}line([0,0,-1.2],[0,0,1.2],border);const projected=points.map(project);faces.map(face=>({face,depth:face.reduce((sum,index)=>sum+projected[index][2],0)/4})).sort((first,last)=>first.depth-last.depth).forEach(({face,depth})=>{context.beginPath();face.forEach((index,order)=>{const vertex=projected[index];if(order===0)context.moveTo(vertex[0],vertex[1]);else context.lineTo(vertex[0],vertex[1])});context.closePath();context.globalAlpha=.28+.28*(depth+1)/2;context.fillStyle=series;context.fill();context.globalAlpha=.18;context.lineWidth=.45;context.strokeStyle=foreground;context.stroke()});context.globalAlpha=1;line([0,0,-.95],[0,0,-.025],foreground,5);line([0,0,.025],[0,0,.95],foreground,5);label([1.12,0,0],'x');label([0,1.12,0],'y');label([0,0,1.2],'z');if(Math.abs(tilt)<1.4){label([0,0,1.03],'nul',15);label([0,0,-1.08],'nul',15)}}function resize(){width=root.clientWidth;const ratio=window.devicePixelRatio||1;canvas.width=width*ratio;canvas.height=height*ratio;context.setTransform(ratio,0,0,ratio,0,0);draw()}function save(){window.openai?.setWidgetState?.({modelContent:{model:'Dipol ideal de mitja ona',magnitude:'Potència normalitzada'},privateContent:{yaw,tilt}})?.catch(()=>{})}canvas.onpointerdown=event=>{drag=[event.clientX,event.clientY];canvas.setPointerCapture(event.pointerId)};canvas.onpointermove=event=>{if(!drag)return;yaw+=(event.clientX-drag[0])*.009;tilt=Math.max(-Math.PI/2,Math.min(Math.PI/2,tilt+(event.clientY-drag[1])*.009));drag=[event.clientX,event.clientY];draw()};canvas.onpointerup=()=>{drag=null;save()};canvas.onpointercancel=()=>{drag=null};root.querySelectorAll('button').forEach(button=>button.onclick=()=>{yaw=button.dataset.view==='front'?0:.6;tilt=button.dataset.view==='top'?Math.PI/2:button.dataset.view==='front'?0:.38;draw();save()});function restore(state){if(Number.isFinite(state?.privateContent?.yaw))yaw=state.privateContent.yaw;if(Number.isFinite(state?.privateContent?.tilt))tilt=state.privateContent.tilt;draw()}restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));new ResizeObserver(resize).observe(root);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style']});resize();window.dipoleCheck={pole:power(0),equator:power(Math.PI/2),faces:faces.length};})();
</script></html>
