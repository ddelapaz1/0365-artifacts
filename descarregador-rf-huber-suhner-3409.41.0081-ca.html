<style>
  :root { --ink:#1b2430; --muted:#5b6675; --accent:#1f4fbf; --panel:rgba(255,255,255,.86); }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- Renderer / escena ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = 'labels';
container.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 5, 1500);
const HOME_POS = new THREE.Vector3(-178, 142, 190);
const HOME_TARGET = new THREE.Vector3(10, 14, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.copy(HOME_TARGET);
controls.minDistance = 60;
controls.maxDistance = 600;
controls.autoRotateSpeed = 1.2;

const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(60, 160, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 10, far: 400 });
sun.shadow.bias = -0.0001;
sun.shadow.normalBias = 0.25;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c0cc, 0.9));
const fill = new THREE.DirectionalLight(0xffffff, 0.8);
fill.position.set(-120, 40, 120);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.ShadowMaterial({ opacity: 0.14 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -49.2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Materiales ----------
// Rendimiento — solo se procesan polígonos visibles:
//  · back-face culling: FrontSide en todos los sólidos (las caras traseras se descartan en la GPU)
//  · frustum culling: activo por defecto en cada malla (lo que queda fuera de cámara no se dibuja)
//  · oclusión: piezas interiores (conductor, GDT) ocultas mientras la carcasa está cerrada; relleno de sección solo en modo corte
const DS = THREE.FrontSide; // sólidos cerrados: una sola cara (evita acné de sombra; el interior se pinta como sección en modo corte)
const MAT = {
  steel:   new THREE.MeshPhysicalMaterial({ color: 0xe6e8eb, metalness: 0.75, roughness: 0.3, side: DS }),
  brushed: new THREE.MeshPhysicalMaterial({ color: 0xdfe2e6, metalness: 0.7, roughness: 0.4, side: DS }),
  inner:   new THREE.MeshPhysicalMaterial({ color: 0xa4abb3, metalness: 0.85, roughness: 0.4, side: DS }),
  gold:    new THREE.MeshPhysicalMaterial({ color: 0xf2c35e, metalness: 0.9, roughness: 0.25, side: DS }),
  rubber:  new THREE.MeshPhysicalMaterial({ color: 0x1e2124, metalness: 0, roughness: 0.55, side: DS }),
  ptfe:    new THREE.MeshPhysicalMaterial({ color: 0xeeeeea, metalness: 0, roughness: 0.5, side: DS }),
  ceramic: new THREE.MeshPhysicalMaterial({ color: 0xf4efe2, metalness: 0, roughness: 0.35, clearcoat: 0.4, side: DS }),
  slot:    new THREE.MeshBasicMaterial({ color: 0x2a1c05, side: DS }),
};

// ---------- Utilidades de geometría ----------
// Cierra el perfil para que toda pieza de revolución sea un sólido cerrado (perfil en sentido antihorario = normales hacia fuera)
const v2 = pts => {
  const v = pts.map(([r, y]) => new THREE.Vector2(r, y));
  if (!v[0].equals(v[v.length - 1])) v.push(v[0].clone());
  return v;
};
function orient(g, axis) {
  if (axis === 'x+') g.rotateZ(-Math.PI / 2);      // eje local +Y -> +X mundo
  else if (axis === 'x-') g.rotateZ(Math.PI / 2);  // eje local +Y -> -X mundo
  return g;
}
function lathe(pts, axis = 'y', segs = 96) {
  return orient(new THREE.LatheGeometry(v2(pts), segs), axis);
}
function hexLathe(pts, axis = 'y') {
  let g = new THREE.LatheGeometry(v2(pts), 6, Math.PI / 6).toNonIndexed();
  g.computeVertexNormals();
  return orient(g, axis);
}
// Perfil de rosca (diente de sierra) entre y0 e y1
function threadPts(r, depth, pitch, y0, y1, rIn) {
  const pts = [[rIn, y0], [r - depth, y0]];
  for (let y = y0; y < y1 - pitch * 0.5; y += pitch) pts.push([r, y + pitch * 0.5], [r - depth, y + pitch]);
  pts.push([r - depth, y1], [rIn, y1]);
  return pts;
}

// ---------- Piezas ----------
// Unidades ≈ mm. Eje coaxial = X (hembra hacia -X, macho hacia +X), cápsula hacia +Y.
const parts = {};
const model = new THREE.Group();
scene.add(model);

function part(key, info) {
  const g = new THREE.Group();
  g.userData.key = key;
  model.add(g);
  parts[key] = { ...info, group: g, explode: new THREE.Vector3(...(info.explode || [0, 0, 0])) };
  return g;
}
function add(group, geo, mat, pos = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat.clone());
  m.position.set(...pos);
  m.castShadow = true;
  m.receiveShadow = true;
  group.add(m);
  return m;
}
// Hexágono con una estría longitudinal en cada cara (tuerca de acoplamiento del macho)
function flutedHexGeo(R, rHole, len, notchDepth, notchHalf) {
  const s = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const a0 = (Math.PI / 3) * i, a1 = a0 + Math.PI / 3, am = (a0 + a1) / 2;
    const p0 = [Math.cos(a0) * R, Math.sin(a0) * R], p1 = [Math.cos(a1) * R, Math.sin(a1) * R];
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    const ux = Math.cos(am + Math.PI / 2), uy = Math.sin(am + Math.PI / 2);
    const nx = Math.cos(am) * notchDepth, ny = Math.sin(am) * notchDepth;
    if (i === 0) s.moveTo(...p0);
    s.lineTo(mx - ux * notchHalf, my - uy * notchHalf);
    s.lineTo(mx - ux * notchHalf * 0.55 - nx, my - uy * notchHalf * 0.55 - ny);
    s.lineTo(mx + ux * notchHalf * 0.55 - nx, my + uy * notchHalf * 0.55 - ny);
    s.lineTo(mx + ux * notchHalf, my + uy * notchHalf);
    s.lineTo(...p1);
  }
  const hole = new THREE.Path();
  hole.absarc(0, 0, rHole, 0, Math.PI * 2, true);
  s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: len - 1.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.5, bevelSegments: 2, curveSegments: 32 });
  g.translate(0, 0, 0.6);
  g.rotateY(Math.PI / 2); // extrusión +Z -> +X
  return g;
}

const BODY_L = 0, BODY_R = 34, TUBE_X = 15;   // extremos del cuerpo y posición de la cápsula
const BODY_RAD = 15, BODY_BOT = -22;          // cuerpo: semicilindro arriba, bloque abajo

// 1) Carcasa en T
const body = part('body', {
  name: 'Carcassa (cos en T)',
  desc: 'Cos metàl·lic que uneix els conductors exteriors de tots dos connectors amb la terra. La línia coaxial el travessa horitzontalment i en vertical en surt la derivació cap a la càpsula de protecció.',
  anchor: [24, -12, BODY_RAD + 0.5],
});
{
  // Sección en "lápida": semicírculo superior + rectángulo inferior con esquinas redondeadas
  const r = BODY_RAD - 1, b = BODY_BOT + 1, c = 3, s = new THREE.Shape();
  s.moveTo(r, 0);
  s.absarc(0, 0, r, 0, Math.PI, false);
  s.lineTo(-r, b + c); s.quadraticCurveTo(-r, b, -r + c, b);
  s.lineTo(r - c, b);  s.quadraticCurveTo(r, b, r, b + c);
  s.lineTo(r, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: BODY_R - BODY_L - 2, bevelEnabled: true, bevelThickness: 1, bevelSize: 1, bevelSegments: 4, curveSegments: 48 });
  g.rotateY(Math.PI / 2);
  add(body, g, MAT.brushed, [BODY_L + 1, 0, 0]);
}
add(body, lathe([[11.6, 0], [13, 0], [13, 50], [11.6, 50]]), MAT.brushed, [TUBE_X, 6, 0]); // tubo vertical

// 2) Conductor interior (visible en corte)
const cond = part('cond', {
  name: 'Conductor interior',
  desc: 'Conductor central que transporta el senyal RF (i l’alimentació DC, si n’hi ha). Una derivació vertical l’uneix al tub de descàrrega de gas.',
  anchor: [-8, 3, 0], hideUnlessInside: true,
});
add(cond, lathe([[0, 0], [2.6, 0], [2.6, 85], [0, 85]], 'x+', 48), MAT.steel, [-34, 0, 0]);
add(cond, lathe([[0, 0], [1.6, 0], [1.6, 16.6], [0, 16.6]], 'y', 32), MAT.steel, [TUBE_X, 2, 0]);
add(cond, lathe([[2.75, 0], [8.8, 0], [8.8, 4], [2.75, 4]], 'x+', 64), MAT.ptfe, [BODY_L + 2, 0, 0]);
add(cond, lathe([[2.75, 0], [8.8, 0], [8.8, 4], [2.75, 4]], 'x+', 64), MAT.ptfe, [BODY_R - 6, 0, 0]);

// 3) Tubo de descarga de gas (GDT)
const gdt = part('gdt', {
  name: 'Tub de descàrrega de gas (GDT)',
  desc: 'Elèctrodes en atmosfera de gas noble dins d’un cos ceràmic. En servei normal és pràcticament un circuit obert (capacitat molt baixa), de manera que no afecta el senyal i deixa passar la DC. Davant d’una sobretensió el gas s’ionitza, s’enceba l’arc i el corrent del llamp es deriva a terra.',
  explode: [0, 36, 0], anchor: [TUBE_X + 8, 25, 0], hideUnlessInside: true,
});
add(gdt, lathe([[0, 0], [6.5, 0], [7, 0.5], [7, 2.5], [0, 2.5]], 'y', 48), MAT.steel, [TUBE_X, 18, 0]);
add(gdt, lathe([[0, -0.2], [7.4, -0.2], [7.4, 8.2], [0, 8.2]], 'y', 48), MAT.ceramic, [TUBE_X, 20.5, 0]);
add(gdt, lathe([[0, 0], [7, 0], [7, 2], [6.5, 2.5], [0, 2.5]], 'y', 48), MAT.steel, [TUBE_X, 28.5, 0]);
{
  const turns = 9, h = 25, r = 5, pts = [];
  for (let i = 0; i <= turns * 32; i++) {
    const a = (i / 32) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, (i / (turns * 32)) * h, Math.sin(a) * r));
  }
  add(gdt, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 400, 0.6, 8), MAT.steel, [TUBE_X, 31, 0]);
}

// 4) Tapa / portacápsula superior
const cap = part('cap', {
  name: 'Tapa de la càpsula (reemplaçable)',
  desc: 'Tapa roscada que tanca l’allotjament del GDT i la seva molla de contacte. Es descargola per l’hexàgon superior per substituir el tub després de descàrregues fortes, sense desmuntar el protector de la línia.',
  explode: [0, 62, 0], anchor: [TUBE_X, 75, 0],
});
add(cap, lathe([[11.8, 0], [13.6, 0], [13.6, 1.8], [11.8, 1.8]]), MAT.steel, [TUBE_X, 55.5, 0]);
add(cap, hexLathe([[0, 0], [14.2, 0], [15.4, 0.8], [15.4, 8], [0, 8]]), MAT.steel, [TUBE_X, 57, 0]);
add(cap, lathe([[0, 0], [14.6, 0], [14.2, 1.2], [13.2, 2.4], [11.8, 3.2], [0, 3.2]]), MAT.steel, [TUBE_X, 64.7, 0]);
{
  const w = 24, d = 13, r = 6.5, s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -d / 2);
  s.lineTo(w / 2 - r, -d / 2); s.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
  s.lineTo(w / 2, d / 2 - r);  s.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
  s.lineTo(-w / 2 + r, d / 2); s.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
  s.lineTo(-w / 2, -d / 2 + r); s.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
  const tab = new THREE.ExtrudeGeometry(s, { depth: 3.6, bevelEnabled: true, bevelThickness: 0.8, bevelSize: 0.8, bevelSegments: 4, curveSegments: 16 });
  tab.rotateX(-Math.PI / 2);
  const tabMesh = add(cap, tab, MAT.steel, [TUBE_X, 68.6, 0]);
  tabMesh.rotation.y = -Math.PI / 4; // lengüeta en diagonal, como en la foto

  // Logotipo sobre la lengüeta
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const x = c.getContext('2d');
  x.translate(256, 256);
  x.fillStyle = '#1f4fbf';
  x.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; x.lineTo(Math.cos(a) * 78, Math.sin(a) * 78); }
  x.closePath(); x.fill();
  x.fillStyle = '#fff'; x.font = 'bold 66px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('HS', 0, 4);
  const txt = 'THE ORIGINAL LIGHTNING PROTECTOR  ·  ';
  x.fillStyle = '#1f4fbf'; x.font = 'bold 34px Arial';
  for (let i = 0; i < txt.length; i++) {
    x.save(); x.rotate((i / txt.length) * Math.PI * 2); x.translate(0, -150); x.fillText(txt[i], 0, 0); x.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(12.5, 12.5).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2 }));
  logo.position.set(TUBE_X, 73.06, 0);
  logo.rotation.y = -Math.PI / 4 + Math.PI / 2;
  cap.add(logo);
}

// 5) Junta tórica
const oring = part('oring', {
  name: 'Junta tòrica',
  desc: 'Segella el protector contra la placa d’entrada de cables (passamurs) i en garanteix l’estanquitat davant l’aigua i la pols.',
  explode: [-34, 0, 0], anchor: [BODY_L - 5.3, 19, 0],
});
add(oring, new THREE.TorusGeometry(17.8, 1.3, 20, 96).rotateY(Math.PI / 2), MAT.rubber, [BODY_L - 5.3, 0, 0]);

// 6) Tuerca del pasamuros
const nut = part('nut', {
  name: 'Femella de fixació (passamurs)',
  desc: 'Estreny el protector contra la placa de terra a través del forat del panell. A més de subjectar-lo, assegura un contacte de baixa impedància entre la carcassa i la terra del panell.',
  explode: [-52, 0, 0], anchor: [BODY_L - 17.5, 19.5, 0],
});
add(nut, hexLathe([[15.8, 0], [17.8, 0], [19.6, 1.2], [19.6, 7.8], [17.8, 9], [15.8, 9]], 'x-'), MAT.steel, [BODY_L - 13, 0, 0]);

// 7) Conector hembra (lado pasamuros)
const fem = part('fem', {
  name: 'Connector 7-16 femella (passamurs)',
  desc: 'Interfície femella amb cos roscat llarg per a muntatge en panell. El contacte central és un casquet ranurat daurat que rep el pin del connector mascle del cable de connexió (jumper).',
  explode: [-18, 0, 0], anchor: [BODY_L - 41, 14, 0], left: true,
});
add(fem, lathe([[14, -0.4], [20, -0.4], [21, 0.8], [21, 3.2], [20, 4], [14, 4]], 'x-'), MAT.brushed, [BODY_L, 0, 0]);     // brida
add(fem, lathe(threadPts(16, 0.7, 1.1, 3.6, 27, 12), 'x-'), MAT.steel, [BODY_L, 0, 0]);                               // rosca pasamuros
add(fem, lathe([[12.2, 26.8], [15, 26.8], [15, 29.2], [12.2, 29.2]], 'x-'), MAT.steel, [BODY_L, 0, 0]);                         // collarín
add(fem, lathe([...threadPts(14.3, 0.6, 1.0, 29, 41, 11.6).slice(0, -1), [13.4, 42], [11.6, 42], [11.6, 37], [11.4, 37]], 'x-'), MAT.steel, [BODY_L, 0, 0]);
add(fem, lathe([[9.4, 34], [10.6, 34], [10.6, 41], [10, 41.5], [9.4, 41.5]], 'x-', 64), MAT.inner, [BODY_L, 0, 0]);  // contacto exterior
add(fem, lathe([[3.6, 34], [9.5, 34], [9.5, 37], [3.6, 37]], 'x-', 64), MAT.ptfe, [BODY_L, 0, 0]);                   // dieléctrico
add(fem, lathe([[0, 32], [3.4, 32], [3.4, 41], [3, 41.6], [1.9, 41.6], [1.9, 38], [0, 38]], 'x-', 64), MAT.gold, [BODY_L, 0, 0]); // casquillo
for (let i = 0; i < 4; i++) {
  const s = add(fem, new THREE.BoxGeometry(4.5, 0.5, 7.2), MAT.slot, [BODY_L - 39.5, 0, 0]);
  s.rotation.x = (i * Math.PI) / 4;
  s.castShadow = false;
}

// 8) Conector macho (tuerca de acoplamiento)
const male = part('male', {
  name: 'Connector 7-16 mascle',
  desc: 'Interfície mascle amb femella d’acoblament giratòria; es rosca directament sobre el connector femella de l’equip o del cable de connexió.',
  explode: [40, 0, 0], anchor: [BODY_R + 22, 18, 0],
});
add(male, lathe([[0, -0.5], [8.5, -0.5], [8.5, 6.3], [0, 6.3]], 'x+'), MAT.brushed, [BODY_R, 0, 0]);
add(male, lathe([[7, 6], [11.5, 6], [12, 6.5], [12, 8.5], [11, 9], [10, 9], [10, 10], [12, 10], [12.5, 10.5], [12.5, 12], [7, 12]], 'x+'), MAT.steel, [BODY_R, 0, 0]);
add(male, lathe([[10.2, 11.8], [15, 11.8], [15.5, 12.3], [15.5, 15.6], [15, 16.4], [10.2, 16.4]], 'x+'), MAT.steel, [BODY_R, 0, 0]);
add(male, flutedHexGeo(17.6, 10, 12, 0.9, 2.6), MAT.steel, [BODY_R + 16, 0, 0]);
add(male, lathe([[12.6, 27.6], [15.6, 27.6], [16, 28.4], [16, 30], [15.4, 30.6], [12.6, 30.6], [12.6, 27.6]], 'x+'), MAT.steel, [BODY_R, 0, 0]);
add(male, lathe([[10.4, 14], [11.2, 14], [11.2, 29], [10.4, 29]], 'x+', 64), MAT.inner, [BODY_R, 0, 0]);
add(male, lathe([[2.55, 20], [10.5, 20], [10.5, 22.5], [2.55, 22.5]], 'x+', 64), MAT.ptfe, [BODY_R, 0, 0]);
add(male, lathe([[0, 16], [2.4, 16], [2.4, 28], [1.6, 29.5], [0, 29.5]], 'x+', 48), MAT.steel, [BODY_R, 0, 0]);

// 9) Borne de tierra (bajo la cápsula, cerca de la brida)
const GND_X = TUBE_X - 3;
const gnd = part('gnd', {
  name: 'Born de posada a terra',
  desc: 'Espàrrec roscat amb femella per connectar el cable de terra al sistema equipotencial (barra de terra). Complementa el contacte a terra que proporciona el muntatge en placa.',
  explode: [0, -16, 0], anchor: [GND_X + 7, -45, 0],
});
add(gnd, lathe([[0, 0], [3.4, 0], [3.4, 24], [0, 24]], 'y', 48), MAT.steel, [GND_X, -43, 0]);
add(gnd, hexLathe([[3.3, 0], [5.4, 0], [6.3, 0.8], [6.3, 5.4], [5.4, 6.2], [3.3, 6.2]]), MAT.steel, [GND_X, -49, 0]);

// ---------- Etiquetas ----------
const labelEls = {};
for (const [key, p] of Object.entries(parts)) {
  const el = document.createElement('div');
  el.className = 'lbl' + (p.left ? ' left' : '');
  el.innerHTML = `<span class="dot"></span><span class="txt">${p.name}</span>`;
  el.addEventListener('pointerdown', e => { e.stopPropagation(); select(key); });
  const obj = new CSS2DObject(el);
  obj.position.set(...p.anchor);
  p.group.add(obj);
  p.label = obj;
  labelEls[key] = el;
}

// ---------- Estado e interacción ----------
const state = { labels: true, explode: false, cut: false, t: 0, selected: null };
const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const allMeshes = [];
model.traverse(o => { if (o.isMesh) { allMeshes.push(o); let p = o.parent; while (p && !p.userData.key) p = p.parent; o.userData.key = p?.userData.key; } });

// Relleno de sección para el modo corte: las caras traseras de cada sólido se pintan en color plano
for (const m of allMeshes) {
  if (m.material.transparent || !m.material.color) continue;
  const mat = new THREE.MeshBasicMaterial({ color: m.material.color.clone().multiplyScalar(0.6), side: THREE.BackSide, clippingPlanes: [cutPlane] });
  const sec = new THREE.Mesh(m.geometry, mat);
  sec.visible = false;
  sec.userData.key = m.userData.key;
  m.add(sec);
  m.userData.section = sec;
}

const infoEl = document.getElementById('info');
const DEFAULT_INFO = infoEl.innerHTML;
let helpDismissed = false; // un clic sobre el panell l’amaga; l’ajuda inicial ja no torna a sortir

function select(key) {
  state.selected = state.selected === key ? null : key;
  for (const m of allMeshes) {
    const on = state.selected && m.userData.key === state.selected;
    if (m.material.emissive) { m.material.emissive.set(on ? 0x1f4fbf : 0x000000); m.material.emissiveIntensity = on ? 0.35 : 0; }
  }
  for (const [k, el] of Object.entries(labelEls)) el.classList.toggle('sel', k === state.selected);
  const p = parts[state.selected];
  infoEl.innerHTML = p ? `<h2>${p.name}</h2><p>${p.desc}</p>` : DEFAULT_INFO;
  infoEl.classList.toggle('hidden', !p && helpDismissed);
}
infoEl.addEventListener('click', () => {
  helpDismissed = true;
  if (state.selected) select(state.selected); // tanca la descripció i desselecciona la peça
  infoEl.classList.add('hidden');
});

const isShown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(allMeshes, false).find(h => isShown(h.object) && (!state.cut || h.point.z <= 0.01));
  if (hit) select(hit.object.userData.key);
  else if (state.selected) select(state.selected);
});

const $ = id => document.getElementById(id);
$('bLabels').onclick = () => { state.labels = !state.labels; $('bLabels').classList.toggle('on', state.labels); labelRenderer.domElement.classList.toggle('hidden', !state.labels); };
$('bExplode').onclick = () => { state.explode = !state.explode; $('bExplode').classList.toggle('on', state.explode); };
$('bCut').onclick = () => {
  state.cut = !state.cut;
  $('bCut').classList.toggle('on', state.cut);
  for (const m of allMeshes) {
    m.material.clippingPlanes = state.cut ? [cutPlane] : null;
    m.material.needsUpdate = true;
    if (m.userData.section) m.userData.section.visible = state.cut;
  }
};
$('bRotate').onclick = () => { controls.autoRotate = !controls.autoRotate; $('bRotate').classList.toggle('on', controls.autoRotate); };
$('bReset').onclick = () => { camera.position.copy(HOME_POS); controls.target.copy(HOME_TARGET); controls.update(); };

const q = new URLSearchParams(location.search);
if (q.has('especejament') || q.has('despiece')) $('bExplode').click();
if (q.has('tall') || q.has('corte')) $('bCut').click();

// ---------- Bucle ----------
function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  // En contenedores estrechos (incrustado en apuntes) alejamos la cámara para que quepa
  camera.fov = w / h < 1 ? 35 / Math.max(w / h, 0.55) : 35;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(container);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  state.t += ((state.explode ? 1 : 0) - state.t) * (1 - Math.exp(-dt * 6));
  const ease = state.t * state.t * (3 - 2 * state.t);
  const interiorVisible = state.cut || state.t > 0.01;
  for (const p of Object.values(parts)) {
    p.group.position.copy(p.explode).multiplyScalar(ease);
    if (p.hideUnlessInside) {
      p.group.visible = interiorVisible; // oclusión: dentro de la carcasa cerrada no se ven, no se procesan
      p.label.visible = state.cut || state.t > 0.6;
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
</body>
